name: Build and Upload to AutoDevice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build with EAS (cloud, iOS simulator)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile simulator --non-interactive --wait

      - name: Download build artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_URL=$(eas build:list --platform ios --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
          curl -L -o app.tar.gz "$BUILD_URL"
          tar -xzf app.tar.gz

      - name: Zip .app bundle
        run: |
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          APP_NAME=$(basename "$APP_PATH")
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/ExpoEASIOSDemo.zip" "$APP_NAME"

      - name: Upload to AutoDevice
        uses: autodevice/upload-action@main
        with:
          api-key: ${{ secrets.AUTODEVICE_API_KEY }}
          package-name: io.autodevice.expo.eas.ios.demo
          build-path: ExpoEASIOSDemo.zip
